<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Downloading Subtitle — SubSync AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(18, 24, 38, 0.85);
      --border-color: rgba(255, 255, 255, 0.1);
      --brand-primary: #6366f1;
      --brand-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      --status-success: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.18) 0%, rgba(168, 85, 247, 0.1) 40%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .download-card {
      position: relative;
      z-index: 1;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 40px rgba(99, 102, 241, 0.15);
    }

    .icon-wrapper {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: rgba(16, 185, 129, 0.12);
      border: 2px solid rgba(16, 185, 129, 0.3);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--status-success);
      animation: pulse-glow 2s infinite ease-in-out;
    }

    .icon-wrapper svg {
      width: 40px;
      height: 40px;
    }

    @keyframes pulse-glow {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 0 25px 5px rgba(16, 185, 129, 0.25);
      }
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .file-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 16px;
      border-radius: 30px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88rem;
      color: #93c5fd;
      margin: 12px 0 20px;
      word-break: break-all;
      max-width: 100%;
    }

    p {
      color: var(--text-muted);
      font-size: 0.92rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 24px;
      background: var(--brand-gradient);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 14px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.35);
      transition: all 0.2s ease;
      margin-bottom: 12px;
    }

    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(99, 102, 241, 0.45);
    }

    .btn-secondary {
      display: inline-block;
      color: var(--text-muted);
      font-size: 0.85rem;
      text-decoration: none;
      transition: color 0.2s;
    }

    .btn-secondary:hover {
      color: var(--text-main);
      text-decoration: underline;
    }

    .status-note {
      margin-top: 18px;
      font-size: 0.8rem;
      color: var(--status-success);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div class="download-card">
    <div class="icon-wrapper" id="statusIcon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
    </div>

    <h1 id="mainHeading">Download Started!</h1>
    
    <div class="file-badge" id="fileNameBadge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px;flex-shrink:0;">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
      </svg>
      <span id="fileNameText">subtitles.srt</span>
    </div>

    <p id="descText">Your translated SRT subtitle file is being saved to your device's <b>Downloads</b> folder automatically.</p>

    <button class="btn-action" id="manualDownloadBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:18px;height:18px;">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      <span>Click Here to Download Again</span>
    </button>

    <a href="https://srttranslator.vercel.app" class="btn-secondary">← Back to SubSync AI Translator</a>

    <div class="status-note" id="statusNote">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:14px;height:14px;">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      <span>100% Timing Preserved & Synchronized</span>
    </div>
  </div>

  <script>
    (function() {
      let parsedFileName = 'subtitles.srt';
      let parsedSrtContent = '';

      function base64ToUnicode(str) {
        try {
          const binary = atob(str);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
          }
          return new TextDecoder('utf-8').decode(bytes);
        } catch (e) {
          try {
            return decodeURIComponent(escape(atob(str)));
          } catch {
            return decodeURIComponent(str);
          }
        }
      }

      try {
        const hash = window.location.hash.slice(1);
        const searchParams = new URLSearchParams(hash || window.location.search);

        parsedFileName = searchParams.get('filename') || 'subtitles_translated.srt';
        const rawData = searchParams.get('data') || '';

        if (rawData) {
          parsedSrtContent = base64ToUnicode(rawData);
        }
      } catch (e) {
        console.error('Error decoding SRT data:', e);
      }

      const fileNameText = document.getElementById('fileNameText');
      if (fileNameText) fileNameText.textContent = parsedFileName;

      function triggerDownload() {
        if (!parsedSrtContent) {
          document.getElementById('descText').textContent = 'No subtitle content was provided. Please translate your file inside the SubSync AI app.';
          document.getElementById('manualDownloadBtn').style.display = 'none';
          return;
        }

        const blob = new Blob(['\uFEFF' + parsedSrtContent], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = parsedFileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      }

      if (parsedSrtContent) {
        setTimeout(triggerDownload, 300);
      } else {
        document.getElementById('descText').textContent = 'Ready to download your subtitle file.';
      }

      document.getElementById('manualDownloadBtn').addEventListener('click', triggerDownload);
    })();
  </script>
</body>
</html>
